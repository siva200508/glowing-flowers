<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers</title>
<style>
:root{--dark:#000}
body{margin:0;padding:0;background:var(--dark);min-height:100vh;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;perspective:1000px}
.night{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(0.1vmin);background-image:radial-gradient(ellipse at top,transparent 0%,var(--dark)),radial-gradient(ellipse at bottom,var(--dark),rgba(145,233,255,0.2)),repeating-linear-gradient(220deg,#000 0px,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(189deg,#000 0px,#000 19px,transparent 19px,transparent 22px),repeating-linear-gradient(148deg,#000 0px,#000 19px,transparent 19px,transparent 22px),linear-gradient(90deg,#00fffa,#f0f)}
.flowers{position:relative;transform:scale(0.9)}
.flower{position:absolute;bottom:10vmin;transform-origin:bottom center;z-index:10;animation:moving-flower-1 4s linear infinite}
.flower--1{animation:moving-flower-1 4s linear infinite}
.flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s linear infinite}
.flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s linear infinite}
.flower--4{left:20%;transform:rotate(10deg);animation:moving-flower-1 4.5s linear infinite}
.flower--5{left:70%;transform:rotate(-10deg);animation:moving-flower-2 3.5s linear infinite}
.flower__leafs{position:relative;animation:blooming-flower 2s backwards}
.flower__leafs--1{animation-delay:1.1s}.flower__leafs--2{animation-delay:1.4s}.flower__leafs--3{animation-delay:1.7s}.flower__leafs--4{animation-delay:2s}.flower__leafs--5{animation-delay:2.3s}
.flower__leaf{position:absolute;bottom:0;left:50%;width:8vmin;height:11vmin;border-radius:51% 49% 47% 53%/44% 45% 55% 69%;background-color:#a7ffee;background-image:linear-gradient(to top,#54b8aa,#a7ffee);transform-origin:bottom center;opacity:0.9;box-shadow:inset 0 0 2vmin rgba(255,255,255,0.5)}
.flower__leaf--1{transform:translate(-10%,1%) rotateY(-40deg) rotateX(-50deg)}
.flower__leaf--2{transform:translate(-50%,-4%) rotateX(40deg)}
.flower__leaf--3{transform:translate(-90%,0%) rotateY(45deg) rotateX(50deg)}
.flower__leaf--4{width:8vmin;height:8vmin;transform-origin:bottom left;border-radius:4vmin 10vmin 4vmin 4vmin;transform:translate(0%,18%) rotateX(70deg) rotate(-43deg);background-image:linear-gradient(to top,#39c6d6,#a7ffee);z-index:1;opacity:0.8}
.flower__white-circle{position:absolute;left:-3.5vmin;top:-3vmin;width:9vmin;height:4vmin;border-radius:50%;background-color:#fff}
.flower__white-circle::after{content:"";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:60%;height:60%;border-radius:50%;background-image:linear-gradient(90deg,#ffeb12,#ffce00)}
.flower__line{height:55vmin;width:1.5vmin;background-image:linear-gradient(to left,rgba(0,0,0,0.2),transparent,rgba(0,0,0,0.2)),linear-gradient(to top,transparent 10%,#14757a,#39c6d6);box-shadow:inset 0 0 2px rgba(0,0,0,0.5);animation:grow-flower-tree 4s backwards}
.flower__line__leaf{--w:7vmin;--h:calc(var(--w) + 2vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(20,117,122,0.4),#39c6d6)}
.flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg)}
.flower__line__leaf--3,.flower__line__leaf--4,.flower__line__leaf--6{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg)}
.flower__line__leaf--4{top:40%}.flower__line__leaf--5{top:0;transform-origin:left;transform:rotate(70deg) rotateY(30deg) scale(0.6)}.flower__line__leaf--6{top:-2%;left:-450%;transform-origin:right;transform:rotate(-70deg) rotateY(30deg) scale(0.6)}
.flower__light{position:absolute;bottom:0vmin;width:1vmin;height:1vmin;background-color:#fffb00;border-radius:50%;filter:blur(0.2vmin);animation:light-ans 4s linear infinite backwards}
.flower__light:nth-child(odd){background-color:#23f0ff}
.flower__light--1{left:-2vmin;animation-delay:1s}.flower__light--2{left:3vmin;animation-delay:0.5s}.flower__light--3{left:-6vmin;animation-delay:0.3s}.flower__light--4{left:6vmin;animation-delay:0.9s}.flower__light--5{left:-1vmin;animation-delay:1.5s}.flower__light--6{left:-4vmin;animation-delay:3s}.flower__light--7{left:3vmin;animation-delay:2s}.flower__light--8{left:-6vmin;animation-delay:3.5s}
.flower__grass{--c:#159faa;--line-w:1.5vmin;position:absolute;bottom:12vmin;left:-7vmin;display:flex;flex-direction:column;align-items:flex-end;z-index:-1;transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}
.flower__grass--1{animation:moving-grass--2 5s linear infinite}.flower__grass--2{left:2vmin;bottom:10vmin;transform:scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);opacity:0.8;z-index:0;animation:moving-grass--2 6s linear infinite}
.flower__grass--top{width:7vmin;height:10vmin;border-top-right-radius:100%;border-right:var(--line-w) solid var(--c);transform-origin:bottom center;transform:rotate(-2deg)}
.flower__grass--bottom{margin-top:-2px;width:var(--line-w);height:25vmin;background-image:linear-gradient(to top,transparent,var(--c))}
.flower__g-long{--w:15vmin;--h:6vmin;--c:#159faa;position:absolute;bottom:10vmin;left:-3vmin;transform-origin:bottom center;transform:rotate(-30deg) rotateY(-20deg);display:flex;flex-direction:column;align-items:flex-end;animation:flower-g-long-ans 3s linear infinite}
.flower__g-long__top{top:calc(var(--h) * -1);width:calc(var(--w) + 1vmin);height:var(--h);border-top-right-radius:100%;border-right:0.7vmin solid var(--c);transform:translate(-0.7vmin,1vmin)}
.flower__g-long__bottom{width:var(--w);height:50vmin;transform-origin:bottom center;background-image:linear-gradient(to top,transparent 30%,var(--c));box-shadow:inset 0 0 2px rgba(0,0,0,0.5)}
@keyframes grow-flower-tree{0%{height:0;border-radius:1vmin}}@keyframes blooming-flower{0%{transform:scale(0)}}@keyframes moving-flower-1{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}@keyframes moving-flower-2{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}@keyframes moving-flower-3{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-20deg) rotateY(-10deg)}}@keyframes light-ans{0%{opacity:0;transform:translateY(0vmin)}25%{opacity:1;transform:translateY(-5vmin) translateX(-2vmin)}50%{opacity:1;transform:translateY(-15vmin) translateX(2vmin);filter:blur(0.2vmin)}75%{transform:translateY(-20vmin) translateX(-2vmin);filter:blur(0.2vmin)}100%{transform:translateY(-30vmin);opacity:0;filter:blur(1vmin)}}
@keyframes moving-grass--2{0%{transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}25%{transform-origin:bottom center;transform:rotate(-50deg) rotateY(40deg)}50%{transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}75%{transform-origin:bottom center;transform:rotate(-46deg) rotateY(40deg)}100%{transform-origin:bottom center;transform:rotate(-48deg) rotateY(40deg)}}
@keyframes flower-g-long-ans{0%,100%{transform:rotate(-30deg) rotateY(-20deg)}50%{transform:rotate(-32deg) rotateY(-20deg)}}
</style>
</head>
<body>
<div class="night"></div>
<div class="flowers">
  <div class="flower flower--1"><div class="flower__leafs flower__leafs--1"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div><div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div><div class="flower__light flower__light--5"></div><div class="flower__light flower__light--6"></div><div class="flower__light flower__light--7"></div><div class="flower__light flower__light--8"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div><div class="flower__line__leaf flower__line__leaf--5"></div><div class="flower__line__leaf flower__line__leaf--6"></div></div></div>

  <div class="flower flower--2"><div class="flower__leafs flower__leafs--2"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div><div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div><div class="flower__light flower__light--5"></div><div class="flower__light flower__light--6"></div><div class="flower__light flower__light--7"></div><div class="flower__light flower__light--8"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div></div></div>

  <div class="flower flower--3"><div class="flower__leafs flower__leafs--3"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div><div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div><div class="flower__light flower__light--5"></div><div class="flower__light flower__light--6"></div><div class="flower__light flower__light--7"></div><div class="flower__light flower__light--8"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div></div></div>

  <div class="flower flower--4"><div class="flower__leafs flower__leafs--4"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div><div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div><div class="flower__light flower__light--3"></div><div class="flower__light flower__light--4"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div></div></div>

  <div class="flower flower--5"><div class="flower__leafs flower__leafs--5"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__white-circle"></div><div class="flower__light flower__light--1"></div><div class="flower__light flower__light--2"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div></div></div>

  <div class="flower__g-long"><div class="flower__g-long__top"></div><div class="flower__g-long__bottom"></div></div>
</div>
</body>
</html>
